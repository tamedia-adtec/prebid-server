adapters:
  appnexus:
    endpoint: "https://goldbach-emea.adnxs.com/openrtb2"
  rubicon:
    disabled: false
    endpoint: "http://exapi-eu.rubiconproject.com/a/api/exchange.json?tk_sdc=eu"
gdpr:
  enabled: true
  default_value: 1
  host_vendor_id: 580
  timeouts_ms:
    init_vendorlist_fetches: 180000
    active_vendorlist_fetch: 180000
metrics:
  prometheus:
    port: 8001
compression:
  response:
    enable_gzip: true
  request:
    enable_gzip: true
http:
  max-idle-conns: 2000
  max-idle-conns-per-host: 500
http_client:
  max_idle_connections: 2000
  max_idle_connections_per_host: 500
  max_connections_per_host: 0
http_client_cache:
  max_idle_connections: 500
  max_idle_connections_per_host: 100
account_defaults:
  debug_allow: true
